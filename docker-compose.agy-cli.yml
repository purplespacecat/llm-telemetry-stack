# Antigravity CLI data for agy-exporter. Enable with COMPOSE_FILE in .env; see README.md.
services:
  agy-exporter:
    volumes:
      - type: bind
        source: ${AGY_CLI_DIR:-~/.gemini/antigravity-cli}/conversations
        target: /gemini/antigravity-cli/conversations
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${AGY_CLI_DIR:-~/.gemini/antigravity-cli}/brain
        target: /gemini/antigravity-cli/brain
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${AGY_CLI_DIR:-~/.gemini/antigravity-cli}/conversation_summaries.db
        target: /gemini/antigravity-cli/conversation_summaries.db
        read_only: true
        bind:
          create_host_path: false
