receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  transform/drop-tool-arguments:
    error_mode: ignore
    log_statements:
      - set(log.cache["params"], ParseJSON(log.attributes["tool_parameters"])) where log.attributes["tool_parameters"] != nil
      - set(log.attributes["mcp_server_name"], log.cache["params"]["mcp_server_name"]) where log.cache["params"]["mcp_server_name"] != nil
      - set(log.attributes["mcp_tool_name"], log.cache["params"]["mcp_tool_name"]) where log.cache["params"]["mcp_tool_name"] != nil
      - delete_key(log.attributes, "tool_parameters")
      - delete_key(log.attributes, "tool_input")
      - delete_key(log.attributes, "error") where log.attributes["event.name"] == "tool_result"

exporters:
  clickhouse:
    endpoint: tcp://clickhouse:9000?dial_timeout=10s
    database: otel
    username: ${env:CLICKHOUSE_USER}
    password: ${env:CLICKHOUSE_PASSWORD}
    create_schema: true
    ttl: 8760h
    timeout: 10s

service:
  pipelines:
    metrics:
      receivers: [otlp]
      exporters: [clickhouse]
    logs:
      receivers: [otlp]
      processors: [transform/drop-tool-arguments]
      exporters: [clickhouse]
    traces:
      receivers: [otlp]
      exporters: [clickhouse]
